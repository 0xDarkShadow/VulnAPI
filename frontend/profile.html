<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VulnAPI - My Profile</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 20px 50px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 26px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
}

nav a:hover {
    color: #ccc;
}

.profile-container {
    max-width: 600px;
    margin: 80px auto;
    padding: 20px;
}

.profile-card {
    background: white;
    border-radius: 15px;
    padding: 50px 40px;
    text-align: center;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.12);
}

.profile-icon {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    background: #e5e5e5;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 70px;
    color: #777;
}

.profile-card h2 {
    font-size: 28px;
    margin-bottom: 35px;
}

.details-btn {
    display: inline-block;

    padding: 13px 30px;

    background: #111;
    color: white;

    text-decoration: none;

    border-radius: 7px;

    font-size: 16px;
    cursor: pointer;
}

.details-btn:hover {
    background: #333;
}

.back-btn {
    display: inline-block;

    margin-top: 20px;

    color: #555;

    text-decoration: none;

    font-size: 14px;
}

.back-btn:hover {
    color: #111;
}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <h1>VulnAPI</h1>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="cars.html">
            Cars
        </a>

        <a href="booking.html">
            My Bookings
        </a>

        <a href="profile.html">
            My Profile
        </a>

        <a href="#" onclick="logout(); return false;">
            Logout
        </a>

    </nav>

</header>


<!-- =========================================
     PROFILE
========================================= -->

<div class="profile-container">

    <div class="profile-card">

        <div class="profile-icon">
            👤
        </div>

        <h2 id="username">
            Loading...
        </h2>

        <a
            href="#"
            class="details-btn"
            onclick="viewDetails(); return false;"
        >
            View Details
        </a>

        <br>

        <a
            href="index.html"
            class="back-btn"
        >
            Back to Home
        </a>

    </div>

</div>


<script>


// =========================================
// GET LOGGED-IN USER ID
// =========================================

const userId =
    localStorage.getItem("user_id");


// =========================================
// CHECK LOGIN
// =========================================

if (!userId) {

    window.location.href =
        "login.html";

}


// =========================================
// LOAD PROFILE
//
// BFLA LAB
//
// Endpoint:
//
// GET /api/user/
//
// Headers:
//
// X-User-ID: logged-in user
// X-User-Role: user
//
// During Burp testing:
//
// Change:
//
// X-User-Role: user
//
// to:
//
// X-User-Role: admin
//
// =========================================

async function loadProfile() {

    try {

        const response =
            await fetch("/api/user/", {

                method: "GET",

                headers: {

                    "X-User-ID": userId,

                    "X-User-Role": "user"

                }

            });


        // =====================================
        // CHECK RESPONSE
        // =====================================

        if (!response.ok) {

            console.error(
                "Profile API error:",
                response.status,
                response.statusText
            );

            showUsername();

            return;

        }


        // =====================================
        // PARSE JSON
        // =====================================

        const data =
            await response.json();


        // =====================================
        // DEBUG
        // =====================================

        console.log(
            "BFLA API response:",
            data
        );


        // =====================================
        // PROFILE RESPONSE
        // =====================================

        if (data.profile) {

            const usernameElement =
                document.getElementById(
                    "username"
                );


            if (usernameElement) {

                usernameElement.innerText =
                    data.profile.username;

            }


            // Store the ID returned by
            // GET /api/user/
            //
            // This ID is later used by
            // user-details.html

            localStorage.setItem(
                "profile_user_id",
                data.profile.id
            );

        }

        else {

            showUsername();

        }

    }

    catch (error) {

        console.error(
            "Profile loading error:",
            error
        );

        showUsername();

    }

}


// =========================================
// VIEW DETAILS
//
// Redirect:
//
// user-details.html?user_id=USER_ID
//
// Then user-details.html calls:
//
// GET /api/user/{user_id}
//
// This is your BOLA endpoint.
//
// =========================================

function viewDetails() {

    const profileUserId =
        localStorage.getItem(
            "profile_user_id"
        );


    if (!profileUserId) {

        alert(
            "Profile details not found."
        );

        return;

    }


    window.location.href =
        `user-details?user_id=${profileUserId}`;

}


// =========================================
// FALLBACK USERNAME
// =========================================

function showUsername() {

    const username =
        localStorage.getItem(
            "username"
        );


    const usernameElement =
        document.getElementById(
            "username"
        );


    if (usernameElement) {

        usernameElement.innerText =
            username || "User";

    }

}


// =========================================
// LOGOUT
// =========================================

function logout() {

    localStorage.removeItem(
        "user_id"
    );

    localStorage.removeItem(
        "username"
    );

    localStorage.removeItem(
        "role"
    );

    localStorage.removeItem(
        "profile_user_id"
    );


    window.location.href =
        "login.html";

}


// =========================================
// LOAD PROFILE
// =========================================

loadProfile();


</script>


</body>

</html>
