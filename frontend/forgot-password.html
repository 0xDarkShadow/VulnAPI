<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - VulnAPI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #555;
        }

        button {
            width: 100%;

            padding: 11px;

            margin-top: 20px;

            border: none;

            border-radius: 5px;

            background: #222;

            color: white;

            font-size: 15px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #message {
            margin-top: 15px;

            text-align: center;

            min-height: 20px;
        }

        .back {
            text-align: center;

            margin-top: 20px;
        }

        .back a {
            color: #222;

            text-decoration: none;
        }

        .back a:hover {
            text-decoration: underline;
        }

        /* =====================================
           MODAL / DIALOG
           ===================================== */

        .modal {
            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.55);

            justify-content: center;
            align-items: center;
        }

        .modal-content {
            width: 350px;

            background: white;

            padding: 28px;

            border-radius: 10px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.3);

            position: relative;
        }

        .modal-content h3 {
            text-align: center;

            margin-top: 0;

            margin-bottom: 10px;
        }

        .modal-content p {
            text-align: center;

            color: #555;

            margin-bottom: 20px;
        }

        .close {
            position: absolute;

            right: 15px;
            top: 10px;

            font-size: 25px;

            cursor: pointer;

            color: #555;
        }

        .close:hover {
            color: #000;
        }

    </style>

</head>


<body>


<!-- ==========================================
     MAIN FORGOT PASSWORD PAGE
     ========================================== -->

<div class="container">

    <h2>Forgot Password</h2>


    <form id="usernameForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >

        <button type="submit">
            Generate OTP
        </button>

    </form>


    <div id="message"></div>


    <div class="back">

        <a href="/login">
            Back to Login
        </a>

    </div>

</div>



<!-- ==========================================
     OTP DIALOG
     ========================================== -->

<div
    id="otpModal"
    class="modal"
>

    <div class="modal-content">

        <span
            id="closeOtp"
            class="close"
        >
            &times;
        </span>


        <h3>
            Enter OTP
        </h3>


        <p>
            Enter the 4-digit OTP sent to you.
        </p>


        <form id="otpForm">

            <label for="otp">
                OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="4"
                minlength="4"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="Enter 4-digit OTP"
                required
            >


            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>

</div>



<!-- ==========================================
     RESET PASSWORD DIALOG
     ========================================== -->

<div
    id="passwordModal"
    class="modal"
>

    <div class="modal-content">

        <h3>
            Reset Password
        </h3>

        <p>
            Create a new password.
        </p>


        <form id="resetForm">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                autocomplete="new-password"
                required
            >


            <button type="submit">
                Reset Password
            </button>

        </form>

    </div>

</div>



<script>


// ==========================================
// GLOBAL USERNAME
// ==========================================

let username = "";


// ==========================================
// GET ELEMENTS
// ==========================================

const usernameForm =
    document.getElementById("usernameForm");

const otpForm =
    document.getElementById("otpForm");

const resetForm =
    document.getElementById("resetForm");

const usernameInput =
    document.getElementById("username");

const otpInput =
    document.getElementById("otp");

const newPasswordInput =
    document.getElementById("newPassword");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const message =
    document.getElementById("message");

const otpModal =
    document.getElementById("otpModal");

const passwordModal =
    document.getElementById("passwordModal");

const closeOtp =
    document.getElementById("closeOtp");


// ==========================================
// STEP 1
// GENERATE OTP
// ==========================================

usernameForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        username =
            usernameInput.value.trim();


        if (username === "") {

            message.style.color =
                "red";

            message.innerText =
                "Please enter your username.";

            return;
        }


        try {

            const response = await fetch(
                "/api/forgot-password?username=" +
                encodeURIComponent(username),
                {
                    method: "POST"
                }
            );


            const result =
                await response.json();


            console.log(
                "Forgot Password Response:",
                result
            );


            if (response.ok) {

                /*
                 * OTP itself is NOT displayed.
                 *
                 * Only the OTP input dialog
                 * is opened.
                 */

                message.style.color =
                    "green";

                message.innerText =
                    "OTP generated successfully.";


                otpModal.style.display =
                    "flex";


                otpInput.value = "";

                otpInput.focus();

            }

            else {

                message.style.color =
                    "red";

                message.innerText =
                    result.message ||
                    "Unable to generate OTP.";

            }

        }

        catch (error) {

            console.error(
                "Forgot Password Error:",
                error
            );


            message.style.color =
                "red";

            message.innerText =
                "Something went wrong.";

        }

    }
);


// ==========================================
// STEP 2
// VERIFY OTP
// ==========================================

otpForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const otp =
            otpInput.value.trim();


        // ======================================
        // CHECK OTP FORMAT
        // ======================================

        if (!/^\d{4}$/.test(otp)) {

            alert(
                "Please enter exactly 4 digits."
            );

            otpInput.focus();

            return;
        }


        try {

            // ======================================
            // SEND OTP TO BACKEND
            // ======================================

            const response = await fetch(
                "/api/verify-otp?username=" +
                encodeURIComponent(username) +
                "&otp=" +
                encodeURIComponent(otp),
                {
                    method: "POST"
                }
            );


            console.log(
                "Verify OTP Response URL:",
                response.url
            );


            console.log(
                "Verify OTP Response Status:",
                response.status
            );


            console.log(
                "Verify OTP Redirected:",
                response.redirected
            );


            // ======================================
            // CORRECT OTP
            // ======================================
            //
            // Backend returns HTTP 302.
            //
            // Browser fetch follows the redirect,
            // so the final response can become 200.
            //
            // response.redirected tells us that
            // the request was redirected.
            // ======================================

            if (response.redirected) {

                console.log(
                    "Correct OTP - redirect detected."
                );


                otpModal.style.display =
                    "none";


                passwordModal.style.display =
                    "flex";


                newPasswordInput.focus();


                message.style.color =
                    "green";


                message.innerText =
                    "OTP verified successfully.";


                return;
            }


            // ======================================
            // WRONG OTP
            // ======================================

            if (response.status === 200) {

                const result =
                    await response.json();


                console.log(
                    "Wrong OTP response:",
                    result
                );


                alert(
                    result.message ||
                    "Invalid OTP."
                );


                otpInput.value = "";


                otpInput.focus();


                return;
            }


            // ======================================
            // OTHER RESPONSE
            // ======================================

            alert(
                "Unexpected server response: " +
                response.status
            );

        }


        catch (error) {

            console.error(
                "Verify OTP Error:",
                error
            );


            alert(
                "Something went wrong."
            );


            otpInput.focus();

        }

    }
);


// ==========================================
// STEP 3
// RESET PASSWORD
// ==========================================

resetForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const newPassword =
            newPasswordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        if (newPassword === "") {

            alert(
                "Please enter a new password."
            );

            return;
        }


        if (
            newPassword !==
            confirmPassword
        ) {

            alert(
                "Passwords do not match."
            );

            return;
        }


        try {

            const response = await fetch(
                "/api/reset-password?username=" +
                encodeURIComponent(username) +
                "&new_password=" +
                encodeURIComponent(newPassword),
                {
                    method: "POST"
                }
            );


            const result =
                await response.json();


            console.log(
                "Reset Password Response:",
                result
            );


            if (
                response.ok &&
                result.success === true
            ) {

                passwordModal.style.display =
                    "none";


                message.style.color =
                    "green";


                message.innerText =
                    "Password reset successful. Redirecting to login...";


                setTimeout(
                    function() {

                        window.location.href =
                            "/login";

                    },
                    1500
                );

            }

            else {

                alert(
                    result.message ||
                    "Password reset failed."
                );

            }

        }

        catch (error) {

            console.error(
                "Reset Password Error:",
                error
            );


            alert(
                "Something went wrong."
            );

        }

    }
);


// ==========================================
// CLOSE OTP DIALOG
// ==========================================

closeOtp.addEventListener(
    "click",
    function() {

        otpModal.style.display =
            "none";

    }
);


// ==========================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// ==========================================

window.addEventListener(
    "click",
    function(event) {

        if (
            event.target ===
            otpModal
        ) {

            otpModal.style.display =
                "none";

        }

    }
);


</script>


</body>

</html>
