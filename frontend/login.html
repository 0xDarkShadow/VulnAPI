<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - VulnAPI</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f7fa;

            min-height: 100vh;

        }


        /* ================================
           HEADER
        ================================= */

        header {

            background: #111827;

            color: white;

            padding: 20px 60px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .logo {

            font-size: 25px;

            font-weight: bold;

        }


        nav a {

            color: white;

            text-decoration: none;

            margin-left: 25px;

        }


        nav a:hover {

            color: #d1d5db;

        }


        /* ================================
           LOGIN CONTAINER
        ================================= */

        .container {

            width: 400px;

            max-width: 90%;

            margin: 80px auto;

        }


        /* ================================
           LOGIN CARD
        ================================= */

        .login-card {

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        /* ================================
           FORM
        ================================= */

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

        }


        input:focus {

            outline: none;

            border-color: #2563eb;

        }


        /* ================================
           LOGIN BUTTON
        ================================= */

        button {

            width: 100%;

            padding: 14px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #1d4ed8;

        }


        button:disabled {

            background: #777;

            cursor: not-allowed;

        }


        /* ================================
           MESSAGE
        ================================= */

        #message {

            text-align: center;

            margin-top: 20px;

            font-weight: bold;

        }


        /* ================================
           FORGOT PASSWORD
        ================================= */

        .forgot-password {

            text-align: center;

            margin-top: 20px;

        }


        .forgot-password a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

        }


        /* ================================
           REGISTER
        ================================= */

        .register {

            text-align: center;

            margin-top: 20px;

            color: #555;

        }


        .register a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>


<!-- =====================================
     HEADER
====================================== -->

<header>


    <div class="logo">

        VulnAPI

    </div>


    <nav>


        <a href="/">

            Home

        </a>


        <a href="/cars">

            Cars

        </a>


    </nav>


</header>



<!-- =====================================
     LOGIN
====================================== -->

<div class="container">


    <div class="login-card">


        <h1>

            Login

        </h1>


        <form id="loginForm">


            <label for="username">

                Username

            </label>


            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >


            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                id="loginButton"
            >

                Login

            </button>


        </form>


        <div id="message"></div>


        <div class="forgot-password">


            <a href="/forgotpassword">

                Forgot Password?

            </a>


        </div>


        <div class="register">


            Don't have an account?


            <a href="/register">

                Register

            </a>


        </div>


    </div>


</div>



<script>


/* =====================================
   LOGIN FORM
===================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const message =
                document
                    .getElementById("message");


            const loginButton =
                document
                    .getElementById("loginButton");


            /* ==============================
               CLEAR OLD MESSAGE
            ============================== */

            message.innerText = "";


            /* ==============================
               DISABLE BUTTON
            ============================== */

            loginButton.disabled = true;

            loginButton.innerText =
                "Logging in...";


            try {


                /* ==============================
                   LOGIN REQUEST
                ============================== */

                const response =
                    await fetch(

                        `/api/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,

                        {

                            method: "POST"

                        }

                    );


                const result =
                    await response.json();


                console.log(
                    "Login response:",
                    result
                );


                /* ==============================
                   LOGIN SUCCESS
                ============================== */

                if (
                    response.ok &&
                    result.user_id &&
                    result.access_token
                ) {


                    /* ==========================
                       SAVE USER ID
                    ========================== */

                    localStorage.setItem(

                        "user_id",

                        result.user_id

                    );


                    /* ==========================
                       SAVE USERNAME
                    ========================== */

                    localStorage.setItem(

                        "username",

                        result.username

                    );


                    /* ==========================
                       SAVE JWT
                    ========================== */

                    localStorage.setItem(

                        "access_token",

                        result.access_token

                    );


                    /* ==========================
                       SAVE ROLE
                    ========================== */

                    if (result.role) {


                        localStorage.setItem(

                            "role",

                            result.role

                        );

                    }


                    /* ==========================
                       SUCCESS MESSAGE
                    ========================== */

                    message.style.color =
                        "green";


                    message.innerText =
                        "Login successful!";


                    /* ==========================
                       REDIRECT
                    ========================== */

                    setTimeout(

                        function() {


                            /*
                               IMPORTANT:

                               Login ke baad
                               index.html nahi.

                               Direct My Profile.
                            */

                            window.location.href =
                                "/";


                        },

                        700

                    );


                }


                else {


                    /* ==========================
                       LOGIN FAILED
                    ========================== */

                    message.style.color =
                        "red";


                    message.innerText =

                        result.message ||

                        result.detail ||

                        "Invalid username or password.";


                    loginButton.disabled =
                        false;


                    loginButton.innerText =
                        "Login";

                }


            }


            catch (error) {


                console.error(
                    "Login error:",
                    error
                );


                message.style.color =
                    "red";


                message.innerText =
                    "Unable to connect to server.";


                loginButton.disabled =
                    false;


                loginButton.innerText =
                    "Login";

            }


        }

    );


</script>


</body>

</html>
